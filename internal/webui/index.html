<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SPDX-FileCopyrightText: 2026 tokajer <tokajer@tokajer.at>
     SPDX-License-Identifier: GPL-3.0-or-later -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDrive Sync</title>
<!--I18N-->
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --fg: #1a1c1f; --muted: #61656c;
    --border: #e2e4e8; --accent: #1a73e8; --accent-fg: #fff;
    --ok: #188038; --warn: #e37400; --err: #d93025; --idle: #5f6368;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #212327; --fg: #e8eaed; --muted: #9aa0a6;
      --border: #34363b; --accent: #8ab4f8; --accent-fg: #17181b;
      --ok: #81c995; --warn: #fdd663; --err: #f28b82; --idle: #9aa0a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--fg); padding: 24px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
  h1 svg { width: 28px; height: 28px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); }
  .dot.idle { background: var(--ok); }
  .dot.syncing { background: var(--accent); animation: pulse 1.2s infinite; }
  .dot.starting { background: var(--warn); animation: pulse 1.2s infinite; }
  .dot.paused { background: var(--idle); }
  .dot.error { background: var(--err); }
  .dot.disconnected { background: var(--idle); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--fg); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--muted); font-size: 13px; }
  .modes { display: flex; gap: 10px; }
  .mode {
    flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer;
  }
  .mode.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .mode b { display: block; margin-bottom: 3px; }
  .path { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
  .crumbs { display: flex; gap: 4px; flex-wrap: wrap; font-size: 13px; margin-bottom: 10px; }
  .crumbs a { color: var(--accent); cursor: pointer; }
  .list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item .name { flex: 1; cursor: default; display: flex; align-items: center; gap: 8px; }
  .item .name.dir { cursor: pointer; }
  .item .name.dir:hover { color: var(--accent); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); }
  .off { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  input[type=checkbox] { width: 16px; height: 16px; }
  .hidden { display: none; }
  .log { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-family: ui-monospace, monospace; font-size: 12px; }
  .logline { display: flex; gap: 8px; padding: 4px 10px; border-top: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; }
  .logline:first-child { border-top: none; }
  .logline .t { color: var(--muted); flex-shrink: 0; }
  .logline.error .m { color: var(--err); }
  .logline.warn .m { color: var(--warn); }
  .clickable { cursor: pointer; text-decoration: underline dotted; }
  .loginbox { background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 13px; }
  .loginbox a { color: var(--accent); word-break: break-all; }
  code { font-family: ui-monospace, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .notice { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .notice b { display: block; margin-bottom: 4px; }
  .step { margin-bottom: 6px; }
  .steps { margin: 8px 0 4px; padding-left: 22px; }
  .steps li { margin-bottom: 8px; }
  .steps a { color: var(--accent); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 13px; font-weight: 600; }
  input[type=text], input[type=password], textarea {
    font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); width: 100%;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 80px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
  .sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .setup-sub { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .credstate { font-size: 13px; margin: 4px 0 14px; }
  .credstate.ok { color: var(--ok); }
  .credstate.warn { color: var(--warn); }
  .filerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"><path d="M 142.12 200.64 A 74 74 0 0 0 201.99 129.29" fill="none" stroke="#f5b301" stroke-width="30" stroke-linecap="round"/><path d="M 201.99 129.29 A 74 74 0 0 0 148.40 56.87" fill="none" stroke="#ea4d3d" stroke-width="30" stroke-linecap="round"/><path d="M 124.13 54.10 L 154.19 36.68 L 142.61 77.05 Z" fill="#ea4d3d"/><path d="M 113.88 55.36 A 74 74 0 0 0 54.01 126.71" fill="none" stroke="#3d7bf4" stroke-width="30" stroke-linecap="round"/><path d="M 54.01 126.71 A 74 74 0 0 0 107.60 199.13" fill="none" stroke="#1fa463" stroke-width="30" stroke-linecap="round"/><path d="M 131.87 201.90 L 101.81 219.32 L 113.39 178.95 Z" fill="#1fa463"/></svg>
    TDrive Sync
  </h1>
  <p class="sub" data-i18n="ui.subtitle"></p>

  <!-- STATUS -->
  <div class="card">
    <div class="row">
      <span class="badge"><span id="dot" class="dot disconnected"></span><span id="state" data-i18n="ui.loading"></span></span>
      <span id="conflictBadge" class="pill hidden clickable" style="border-color:var(--warn);color:var(--warn)" onclick="openConflicts()"></span>
      <span class="spacer"></span>
      <span id="account" class="muted"></span>
    </div>
    <div id="stats" class="muted" style="margin-top:8px"></div>
    <div class="row" style="margin-top:14px">
      <button id="btnSync" class="primary" data-i18n="ui.sync_now"></button>
      <button id="btnPause" data-i18n="ui.pause"></button>
      <button id="btnOpen" data-i18n="ui.open_folder"></button>
      <span class="spacer"></span>
      <button id="btnLogout" class="hidden" data-i18n="ui.sign_out"></button>
    </div>
  </div>

  <!-- UPDATE -->
  <div class="card" id="updateCard">
    <div class="row">
      <span class="badge">Version&nbsp;<b id="curVer">–</b></span>
      <span id="updBadge" class="pill hidden clickable" style="border-color:var(--accent);color:var(--accent)" onclick="openUpdate()"></span>
      <span class="spacer"></span>
      <button id="updCheck" style="padding:4px 10px" data-i18n="ui.check_updates"></button>
    </div>
    <div id="updMsg" class="muted" style="margin-top:8px"></div>
    <div class="row" style="margin-top:12px">
      <button id="updApply" class="primary hidden" data-i18n="ui.update_now"></button>
      <button id="updRestart" class="primary hidden" data-i18n="ui.restart"></button>
      <a id="updLink" class="hidden" href="#" target="_blank" style="color:var(--accent);font-size:13px" data-i18n="ui.release_details"></a>
      <span class="spacer"></span>
      <label class="off"><input type="checkbox" id="updPre"> <span data-i18n="ui.prereleases"></span></label>
    </div>
  </div>

  <!-- LOGIN / SETUP (shown when not configured) -->
  <div class="card hidden" id="loginCard">
    <h2 data-i18n="ui.setup"></h2>

    <div class="notice">
      <b data-i18n="ui.setup_notice_title"></b>
      <span class="muted" data-i18n="ui.setup_notice_body"></span>
      <div style="margin-top:10px"><button id="btnGuide" style="padding:4px 10px" data-i18n="ui.show_guide"></button></div>
    </div>

    <div id="guide" class="hidden">
      <ol class="steps" data-i18n-html="ui.guide_steps"></ol>
    </div>

    <hr class="sep">

    <p class="setup-sub" data-i18n="ui.setup_step1"></p>
    <div id="credState" class="credstate warn" data-i18n="ui.loading"></div>

    <div class="filerow">
      <input type="file" id="credFile" accept=".json,application/json">
      <button id="btnImportFile" data-i18n="ui.import_file"></button>
    </div>

    <div class="field">
      <label for="credJson" data-i18n="ui.paste_json"></label>
      <textarea id="credJson" placeholder='{ "installed": { "client_id": "…", "client_secret": "…" } }'></textarea>
    </div>
    <div class="row" style="margin-bottom:6px">
      <button id="btnImportJson" class="primary" data-i18n="ui.import_json"></button>
      <span class="spacer"></span>
      <button id="btnManualToggle" style="padding:4px 10px" data-i18n="ui.enter_manually"></button>
    </div>

    <div id="manualCreds" class="hidden" style="margin-top:12px">
      <div class="field">
        <label for="clientId" data-i18n="ui.client_id"></label>
        <input type="text" id="clientId" placeholder="…apps.googleusercontent.com" autocomplete="off">
      </div>
      <div class="field">
        <label for="clientSecret" data-i18n="ui.client_secret"></label>
        <input type="password" id="clientSecret" placeholder="GOCSPX-…" autocomplete="off">
      </div>
      <div class="row">
        <button id="btnSaveCreds" class="primary" data-i18n="ui.save"></button>
        <button id="btnClearCreds" style="padding:4px 10px" data-i18n="ui.reset"></button>
      </div>
    </div>

    <hr class="sep">

    <p class="setup-sub" data-i18n="ui.setup_step2"></p>
    <p class="muted" style="margin-top:0" data-i18n="ui.setup_step2_hint"></p>
    <button id="btnLogin" class="primary" data-i18n="ui.sign_in"></button>
    <div id="loginBox" class="loginbox hidden"></div>
  </div>

  <!-- MODE -->
  <div class="card" id="modeCard">
    <h2 data-i18n="ui.sync_mode"></h2>
    <div class="modes">
      <div class="mode" id="modeStream" data-mode="stream">
        <b data-i18n="ui.mode_stream"></b>
        <span class="muted" data-i18n="ui.mode_stream_hint"></span>
      </div>
      <div class="mode" id="modeMirror" data-mode="mirror">
        <b data-i18n="ui.mode_mirror"></b>
        <span class="muted" data-i18n="ui.mode_mirror_hint"></span>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <span class="muted" data-i18n="ui.folder"></span>
      <span id="localDir" class="path"></span>
      <button id="btnChangeDir" style="padding:4px 10px" data-i18n="ui.change"></button>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="off"><input type="checkbox" id="autostart"> <span data-i18n="ui.autostart"></span></label>
    </div>
  </div>

  <!-- CONFLICT HANDLING (mirror mode only) -->
  <div class="card hidden" id="conflictCard">
    <h2 data-i18n="ui.conflict_handling"></h2>
    <div class="modes">
      <div class="mode" id="cmAuto" data-cmode="auto">
        <b data-i18n="ui.conflict_auto"></b>
        <span class="muted" data-i18n="ui.conflict_auto_hint"></span>
      </div>
      <div class="mode" id="cmManual" data-cmode="manual">
        <b data-i18n="ui.conflict_manual"></b>
        <span class="muted" data-i18n="ui.conflict_manual_hint"></span>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <b style="font-size:13px" data-i18n="ui.open_conflicts"></b>
      <span class="spacer"></span>
      <button id="conflictRefresh" style="padding:4px 10px" data-i18n="ui.refresh"></button>
    </div>
    <div id="conflictList" style="margin-top:10px"></div>
  </div>

  <!-- LOG -->
  <div class="card">
    <div class="row" style="cursor:pointer" id="logHeader">
      <h2 style="margin:0"><span data-i18n="ui.log"></span> <span id="logToggle" class="muted" data-i18n="ui.toggle_show"></span></h2>
      <span class="spacer"></span>
      <span id="logErrCount" class="pill hidden" style="border-color:var(--err);color:var(--err)"></span>
    </div>
    <div id="logBody" class="hidden" style="margin-top:14px">
      <div class="row" style="margin-bottom:10px">
        <label class="off"><input type="checkbox" id="logOnlyErr"> <span data-i18n="ui.errors_only"></span></label>
        <span class="spacer"></span>
        <button id="logOpen" style="padding:4px 10px" data-i18n="ui.open_log_files"></button>
        <button id="logRefresh" style="padding:4px 10px" data-i18n="ui.refresh"></button>
        <button id="logClear" style="padding:4px 10px" data-i18n="ui.clear"></button>
      </div>
      <div id="logList" class="log"></div>
    </div>
  </div>

  <!-- OFFLINE BROWSER (stream mode only) -->
  <div class="card" id="offlineCard">
    <h2 data-i18n="ui.available_offline"></h2>
    <p class="muted" data-i18n="ui.available_offline_hint"></p>
    <div id="crumbs" class="crumbs"></div>
    <div id="list" class="list"></div>
  </div>

  <!-- FILE MANAGER INTEGRATION (KDE only) -->
  <div class="card hidden" id="dolphinCard">
    <h2 data-i18n="ui.dolphin"></h2>
    <p class="muted" style="margin-top:0" data-i18n="ui.dolphin_hint"></p>
    <div id="dolphinState" class="credstate warn" data-i18n="ui.loading"></div>
    <div class="row">
      <button id="dolphinInstall" class="primary" data-i18n="ui.dolphin_install"></button>
      <button id="dolphinRemove" class="hidden" data-i18n="ui.dolphin_remove"></button>
    </div>
    <div class="row" style="margin-top:14px">
      <label class="off"><input type="checkbox" id="dolphinPreviews"> <span data-i18n="ui.dolphin_previews"></span></label>
    </div>
    <p class="muted" style="margin:6px 0 0" data-i18n="ui.dolphin_previews_hint"></p>
    <div class="row" style="margin-top:10px">
      <label class="off"><input type="checkbox" id="dolphinPreviewsDefault"> <span data-i18n="ui.dolphin_previews_default"></span></label>
    </div>
    <p class="muted" style="margin:6px 0 0" data-i18n="ui.dolphin_previews_default_hint"></p>
    <div id="dolphinLog" class="loginbox hidden" style="white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:12px;max-height:240px;overflow:auto"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let cur = { configured:false, mode:'stream', paused:false, browsePath:'' };

// --- i18n ---
// The active language and its catalog are injected by the settings server, so
// the page is already translated when it first renders. LOCALE also drives the
// date/time formatting below.
const I18N = window.I18N || {};
const LOCALE = window.APP_LANG || 'en';

// t looks up a message and fills its fmt placeholders (%s / %d) from args, in
// order; %% becomes a literal percent sign.
function t(key, ...args){
  let i = 0;
  const msg = I18N[key] !== undefined ? I18N[key] : key;
  return msg.replace(/%[sd]/g, () => i < args.length ? String(args[i++]) : '')
            .replace(/%%/g, '%');
}
// stateLabel is the fallback text for a sync state the daemon sent no message
// for. An unknown state shows as-is rather than as a missing key.
function stateLabel(state){ const k = 'state.' + state; return I18N[k] || state; }

// applyI18n translates the static markup: data-i18n replaces the text content,
// data-i18n-html the markup (for messages containing links).
function applyI18n(){
  document.documentElement.lang = LOCALE;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
}

async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok) throw new Error(await r.text()); return r.json(); }
function post(path, body){ return api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})}); }

function fmtBytes(n){ if(!n) return ''; const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(1)+' '+u[i]; }

async function refreshStatus(){
  try {
    const d = await api('/api/status');
    const st = d.status; cur.configured = d.configured; cur.mode = st.mode; cur.paused = st.state==='paused';
    $('#dot').className = 'dot ' + st.state;
    $('#state').textContent = st.message || stateLabel(st.state);
    $('#account').textContent = st.account || '';
    let parts = [];
    if(st.speed>0) parts.push('↑↓ ' + fmtBytes(st.speed)+'/s');
    if(st.last_sync && st.last_sync.indexOf('0001')!==0) parts.push(t('ui.last_sync', new Date(st.last_sync).toLocaleTimeString(LOCALE)));
    $('#stats').innerHTML = parts.join('  ·  ');
    if(st.errors>0){
      const sep = parts.length ? '  ·  ' : '';
      $('#stats').innerHTML += sep + '<span class="clickable" style="color:var(--err)" onclick="openLog()">'+escapeHtml(t('ui.error_count', st.errors))+'</span>';
      const pill = $('#logErrCount'); pill.textContent = t('ui.error_count', st.errors); pill.classList.remove('hidden');
    } else {
      $('#logErrCount').classList.add('hidden');
    }

    $('#btnPause').textContent = cur.paused ? t('ui.resume') : t('ui.pause');
    $('#loginCard').classList.toggle('hidden', d.configured);
    if(!d.configured) ensureCredsLoaded();
    $('#btnLogout').classList.toggle('hidden', !d.configured);
    $('#modeCard').classList.toggle('hidden', !d.configured);
    $('#offlineCard').classList.toggle('hidden', !d.configured || st.mode!=='stream');
    $('#conflictCard').classList.toggle('hidden', !d.configured || st.mode!=='mirror');

    $('#localDir').textContent = st.local_dir;
    $('#modeStream').classList.toggle('active', st.mode==='stream');
    $('#modeMirror').classList.toggle('active', st.mode==='mirror');
    $('#cmAuto').classList.toggle('active', st.conflict_mode!=='manual');
    $('#cmManual').classList.toggle('active', st.conflict_mode==='manual');
    $('#autostart').checked = !!d.autostart;
    if(d.configured && st.mode==='mirror') loadConflicts();
    else { lastConflictLoad = 0; updateConflictBadge(0); }
  } catch(e){ $('#state').textContent = t('ui.daemon_unreachable'); }
}

// --- actions ---
$('#btnSync').onclick = ()=> post('/api/sync-now');
$('#btnOpen').onclick = ()=> post('/api/open');
$('#btnPause').onclick = async ()=>{ await post('/api/pause',{paused: !cur.paused}); refreshStatus(); };
$('#btnLogout').onclick = async ()=>{ if(confirm(t('ui.confirm_sign_out'))){ await post('/api/logout'); refreshStatus(); } };
$('#btnChangeDir').onclick = async ()=>{ const p = prompt(t('ui.prompt_local_dir'), $('#localDir').textContent); if(p){ await post('/api/local-dir',{path:p}); refreshStatus(); } };

document.querySelectorAll('[data-mode]').forEach(el => el.onclick = async ()=>{
  const mode = el.dataset.mode;
  if(mode===cur.mode) return;
  await post('/api/mode',{mode});
  refreshStatus();
  if(mode==='stream') browse('');
});

// --- conflict handling ---
document.querySelectorAll('[data-cmode]').forEach(el => el.onclick = async ()=>{
  await post('/api/conflict-mode',{mode: el.dataset.cmode});
  refreshStatus();
});
$('#autostart').onchange = ()=> post('/api/autostart',{on: $('#autostart').checked});
$('#conflictRefresh').onclick = ()=>loadConflicts(true);

function sideLabel(side){ const k = 'ui.side_' + side; return I18N[k] || side; }
let lastConflictLoad = 0;
async function loadConflicts(force){
  if(!cur.configured || cur.mode!=='mirror') return;
  // Throttle the (recursive) scan unless the user forced a refresh.
  const now = Date.now();
  if(!force && now - lastConflictLoad < 8000) return;
  lastConflictLoad = now;
  try {
    const d = await api('/api/conflicts');
    const box = $('#conflictList'); box.innerHTML='';
    const items = d.conflicts || [];
    updateConflictBadge(items.length);
    if(items.length===0){ box.innerHTML='<div class="muted">'+escapeHtml(t('ui.no_conflicts'))+'</div>'; return; }
    const list = document.createElement('div'); list.className='list';
    items.forEach(c=>{
      const item=document.createElement('div'); item.className='item';
      const name=document.createElement('div'); name.className='name';
      name.innerHTML='📄 '+escapeHtml(c.path)+' <span class="pill">'+escapeHtml(sideLabel(c.side))+'</span>';
      const keep=document.createElement('button'); keep.textContent=t('ui.keep_this'); keep.style.padding='4px 10px';
      keep.onclick=async ()=>{ if(confirm(t('ui.confirm_keep'))){ await post('/api/conflict-resolve',{path:c.path, action:'keep'}); loadConflicts(true); } };
      const del=document.createElement('button'); del.textContent=t('ui.delete'); del.style.padding='4px 10px';
      del.onclick=async ()=>{ if(confirm(t('ui.confirm_delete_copy'))){ await post('/api/conflict-resolve',{path:c.path, action:'delete'}); loadConflicts(true); } };
      item.appendChild(name); item.appendChild(keep); item.appendChild(del);
      list.appendChild(item);
    });
    box.appendChild(list);
  } catch(e){}
}
function updateConflictBadge(n){
  const b = $('#conflictBadge');
  if(n>0){ b.textContent = n===1 ? t('ui.conflict_badge_one') : t('ui.conflict_badge_many', n); b.classList.remove('hidden'); }
  else { b.classList.add('hidden'); }
}
function openConflicts(){ $('#conflictCard').scrollIntoView({behavior:'smooth', block:'start'}); }

// --- setup / oauth credentials ---
$('#btnGuide').onclick = ()=>{
  const g = $('#guide'); const hidden = g.classList.toggle('hidden');
  $('#btnGuide').textContent = hidden ? t('ui.show_guide') : t('ui.hide_guide');
};
$('#btnManualToggle').onclick = ()=>{
  const m = $('#manualCreds'); const hidden = m.classList.toggle('hidden');
  $('#btnManualToggle').textContent = hidden ? t('ui.enter_manually') : t('ui.hide_manual');
};

let credsLoaded = false;
function ensureCredsLoaded(){ if(!credsLoaded){ credsLoaded = true; loadCreds(); } }
async function loadCreds(){
  try {
    const d = await api('/api/google-creds');
    setCredState(d.configured, d.client_id);
    if(d.client_id) $('#clientId').value = d.client_id;
  } catch(e){}
}
function setCredState(configured, clientId){
  const el = $('#credState');
  if(configured){
    el.className = 'credstate ok';
    el.textContent = clientId ? t('ui.creds_active_id', clientId) : t('ui.creds_active');
  } else {
    el.className = 'credstate warn';
    el.textContent = t('ui.creds_missing');
  }
}
async function importCredsJson(text){
  if(!text || !text.trim()){ alert(t('ui.alert_pick_json')); return; }
  try {
    const d = await post('/api/google-creds/import', {data: text});
    setCredState(d.configured, d.client_id);
    if(d.client_id) $('#clientId').value = d.client_id;
    $('#credJson').value = '';
    alert(t('ui.alert_import_ok'));
  } catch(e){ alert(t('ui.alert_import_failed', e.message)); }
}
$('#btnImportJson').onclick = ()=> importCredsJson($('#credJson').value);
$('#credFile').onchange = ()=>{
  const f = $('#credFile').files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=> importCredsJson(String(reader.result));
  reader.readAsText(f);
};
$('#btnImportFile').onclick = ()=> $('#credFile').click();
$('#btnSaveCreds').onclick = async ()=>{
  const client_id = $('#clientId').value.trim();
  const client_secret = $('#clientSecret').value.trim();
  if(!client_id || !client_secret){ alert(t('ui.alert_creds_needed')); return; }
  try {
    const d = await post('/api/google-creds/save', {client_id, client_secret});
    setCredState(d.configured, d.client_id);
    $('#clientSecret').value = '';
    alert(t('ui.alert_save_ok'));
  } catch(e){ alert(t('ui.alert_save_failed', e.message)); }
};
$('#btnClearCreds').onclick = async ()=>{
  if(!confirm(t('ui.confirm_clear_creds'))) return;
  try {
    const d = await post('/api/google-creds/save', {client_id:'', client_secret:''});
    setCredState(d.configured, d.client_id);
    $('#clientId').value = ''; $('#clientSecret').value = '';
  } catch(e){ alert(t('ui.error', e.message)); }
};

// --- login ---
$('#btnLogin').onclick = async ()=>{
  $('#loginBox').classList.remove('hidden');
  $('#loginBox').textContent = t('ui.login_starting');
  await post('/api/login');
  pollLogin();
};
async function pollLogin(){
  const d = await api('/api/login-status');
  let html = '';
  const urlLine = d.lines.find(l => l.indexOf('http://127.0.0.1')>=0 || l.indexOf('https://')>=0);
  if(urlLine){
    const m = urlLine.match(/https?:\/\/\S+/);
    if(m) html += escapeHtml(t('ui.login_open_link'))+'<br><a href="'+escapeHtml(m[0])+'" target="_blank">'+escapeHtml(m[0])+'</a><br><br>';
  }
  if(d.error) html += '<b style="color:var(--err)">'+escapeHtml(t('ui.login_error_label'))+'</b> '+escapeHtml(d.error);
  else if(!d.active && d.configured) html += '<b style="color:var(--ok)">'+escapeHtml(t('ui.login_signed_in', d.account))+'</b>';
  else if(d.active) html += escapeHtml(t('ui.login_waiting'));
  $('#loginBox').innerHTML = html || escapeHtml(t('ui.login_starting_short'));
  if(d.active){ setTimeout(pollLogin, 1000); }
  else { refreshStatus(); if(d.configured) setTimeout(()=>$('#loginBox').classList.add('hidden'), 4000); }
}

// --- offline browser ---
async function browse(path){
  cur.browsePath = path;
  const d = await api('/api/browse?path='+encodeURIComponent(path));
  // breadcrumbs
  const cr = $('#crumbs'); cr.innerHTML='';
  const mk = (label, p)=>{ const a=document.createElement('a'); a.textContent=label; a.onclick=()=>browse(p); return a; };
  cr.appendChild(mk(t('ui.drive_root'),''));
  let acc='';
  (path? path.split('/'):[]).forEach(part=>{ acc = acc? acc+'/'+part : part; cr.appendChild(document.createTextNode(' / ')); cr.appendChild(mk(part, acc)); });
  // list
  const list = $('#list'); list.innerHTML='';
  if(d.entries.length===0){ list.innerHTML='<div class="item muted">'+escapeHtml(t('ui.empty_folder'))+'</div>'; }
  d.entries.forEach(e=>{
    const item=document.createElement('div'); item.className='item';
    const name=document.createElement('div'); name.className='name'+(e.is_dir?' dir':'');
    name.innerHTML=(e.is_dir?'📁 ':'📄 ')+escapeHtml(e.name);
    if(e.is_dir) name.onclick=()=>browse(e.path);
    item.appendChild(name);
    if(e.is_dir){
      const off=document.createElement('label'); off.className='off';
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=e.offline;
      // A folder inside a pinned folder is offline through its parent; it cannot
      // be released on its own, so the box shows the state without being usable.
      cb.disabled = e.inherited;
      cb.onchange=async ()=>{ await post('/api/offline',{path:e.path, on:cb.checked}); };
      off.appendChild(cb); off.appendChild(document.createTextNode(e.inherited ? t('ui.offline_parent') : t('ui.offline')));
      item.appendChild(off);
    } else if(e.offline){
      const p=document.createElement('span'); p.className='pill'; p.textContent=t('ui.offline'); item.appendChild(p);
    }
    list.appendChild(item);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- file manager integration (KDE/Dolphin) ---
// The plugin is compiled on this machine, which takes a few seconds and can fail
// on a missing devel package – so the card shows the build output, not a spinner.
let dolphinTimer = null;
async function loadDolphin(){
  let d;
  try { d = await api('/api/dolphin'); } catch(e){ return; }
  $('#dolphinCard').classList.toggle('hidden', !d.kde);
  if(!d.kde) return;
  const running = !!d.job;
  const st = $('#dolphinState');
  if(running){
    st.className = 'credstate';
    st.textContent = d.job==='remove' ? t('ui.dolphin_removing') : t('ui.dolphin_installing');
  } else if(d.installed){
    st.className = 'credstate ok';
    st.textContent = d.on_plugin_path ? t('ui.dolphin_installed') : t('ui.dolphin_restart_needed');
  } else {
    st.className = 'credstate warn';
    st.textContent = d.requirements ? t('ui.dolphin_deps_missing') : t('ui.dolphin_not_installed');
  }
  $('#dolphinInstall').textContent = d.installed ? t('ui.dolphin_reinstall') : t('ui.dolphin_install');
  $('#dolphinInstall').disabled = running;
  $('#dolphinRemove').classList.toggle('hidden', !d.installed);
  $('#dolphinRemove').disabled = running;
  $('#dolphinPreviews').checked = !!d.previews_disabled;
  $('#dolphinPreviewsDefault').checked = !!d.previews_default_off;

  // Requirements first (they say what to install), then the build output, then
  // the failure – the hint the user has to act on must never be swallowed.
  let text = '';
  if(d.requirements && !d.installed) text = d.requirements;
  if((d.lines||[]).length) text = (text? text+'\n\n':'') + d.lines.join('\n');
  if(d.error) text = (text? text+'\n\n':'') + t('ui.dolphin_failed') + ' ' + d.error;
  const box = $('#dolphinLog');
  box.textContent = text;
  box.classList.toggle('hidden', !text);

  clearTimeout(dolphinTimer);
  if(running) dolphinTimer = setTimeout(loadDolphin, 1000);
}
$('#dolphinInstall').onclick = async ()=>{
  $('#dolphinState').textContent = t('ui.dolphin_installing');
  try { await post('/api/dolphin/install'); } catch(e){}
  loadDolphin();
};
$('#dolphinRemove').onclick = async ()=>{
  if(!confirm(t('ui.confirm_dolphin_remove'))) return;
  try { await post('/api/dolphin/remove'); } catch(e){}
  loadDolphin();
};
$('#dolphinPreviewsDefault').onchange = async ()=>{
  const disabled = $('#dolphinPreviewsDefault').checked;
  try {
    await post('/api/dolphin/previews-default', {disabled});
    alert(t(disabled ? 'ui.dolphin_previews_default_done' : 'ui.dolphin_previews_default_undone'));
  } catch(e){ alert(t('ui.error', e.message)); }
  loadDolphin();
};
$('#dolphinPreviews').onchange = async ()=>{
  const disabled = $('#dolphinPreviews').checked;
  try {
    await post('/api/dolphin/previews', {disabled});
    alert(t(disabled ? 'ui.dolphin_previews_off_done' : 'ui.dolphin_previews_on_done'));
  } catch(e){ alert(t('ui.error', e.message)); }
  loadDolphin();
};

// --- log panel ---
let logOpen = false;
function toggleLog(force){
  logOpen = (typeof force==='boolean') ? force : !logOpen;
  $('#logBody').classList.toggle('hidden', !logOpen);
  $('#logToggle').textContent = logOpen ? t('ui.toggle_hide') : t('ui.toggle_show');
  if(logOpen) loadLog();
}
function openLog(){ toggleLog(true); $('#logBody').scrollIntoView({behavior:'smooth', block:'nearest'}); }
async function loadLog(){
  const only = $('#logOnlyErr').checked ? '?level=error' : '';
  const d = await api('/api/logs'+only);
  const list = $('#logList'); list.innerHTML='';
  if(d.entries.length===0){ list.innerHTML='<div class="logline muted">'+escapeHtml(t('ui.no_entries'))+'</div>'; return; }
  d.entries.slice().reverse().forEach(e=>{
    const div=document.createElement('div'); div.className='logline '+e.level;
    const time=new Date(e.time).toLocaleTimeString(LOCALE);
    div.innerHTML='<span class="t">'+escapeHtml(time)+'</span><span class="m">'+escapeHtml(e.msg)+'</span>';
    list.appendChild(div);
  });
}
$('#logHeader').onclick = ()=>toggleLog();
$('#logOpen').onclick = (e)=>{ e.stopPropagation(); post('/api/open-logs'); };
$('#logRefresh').onclick = (e)=>{ e.stopPropagation(); loadLog(); };
$('#logOnlyErr').onchange = loadLog;
$('#logClear').onclick = async (e)=>{ e.stopPropagation(); if(confirm(t('ui.confirm_clear_log'))){ await post('/api/logs/clear'); loadLog(); refreshStatus(); } };

// --- update panel ---
async function loadUpdate(){
  try {
    const d = await api('/api/update');
    $('#curVer').textContent = d.current || '–';
    $('#updPre').checked = !!d.include_prerelease;
    const canUpd = !!d.can_self_update, st = d.state;
    $('#updApply').classList.add('hidden');
    $('#updRestart').classList.add('hidden');
    $('#updLink').classList.add('hidden');
    $('#updBadge').classList.add('hidden');
    $('#updCheck').disabled = (st==='downloading');
    let msg = d.message || '';
    if(st==='available'){
      $('#updBadge').textContent = t('ui.update_new', d.tag||d.available);
      $('#updBadge').classList.remove('hidden');
      if(d.release_url && d.release_url!==''){ $('#updLink').href=d.release_url; $('#updLink').classList.remove('hidden'); }
      if(canUpd){ $('#updApply').classList.remove('hidden'); }
      else { msg = t('ui.update_appimage_only', d.tag||d.available); }
    } else if(st==='downloading'){
      msg = t('ui.update_downloading', d.progress||0);
    } else if(st==='ready'){
      $('#updRestart').classList.remove('hidden');
    }
    $('#updMsg').textContent = msg;
  } catch(e){}
}
function openUpdate(){ $('#updateCard').scrollIntoView({behavior:'smooth', block:'start'}); }
$('#updCheck').onclick = async ()=>{ $('#updMsg').textContent=t('ui.update_searching'); try{ await post('/api/update/check'); }catch(e){} loadUpdate(); };
$('#updApply').onclick = async ()=>{ if(confirm(t('ui.confirm_update'))){ await post('/api/update/apply'); loadUpdate(); } };
$('#updRestart').onclick = async ()=>{ if(confirm(t('ui.confirm_update_restart'))){ await post('/api/update/restart'); $('#updMsg').textContent=t('ui.restarting'); setTimeout(()=>{ try{ window.close(); }catch(e){} }, 400); } };
$('#updPre').onchange = async ()=>{ await post('/api/update/prerelease',{on:$('#updPre').checked}); $('#updMsg').textContent=t('ui.update_checking'); setTimeout(loadUpdate, 800); };

// init
applyI18n();
refreshStatus();
loadUpdate();
loadDolphin();
setInterval(loadUpdate, 5000);
setInterval(refreshStatus, 2500);
// Rarely: this only changes when the user installs packages or restarts Dolphin.
setInterval(loadDolphin, 30000);
setInterval(()=>{ if(logOpen) loadLog(); }, 4000);
setTimeout(async ()=>{ const d = await api('/api/status'); if(d.configured && d.status.mode==='stream') browse(''); }, 400);
</script>
