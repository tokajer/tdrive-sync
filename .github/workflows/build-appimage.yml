name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Vulnerability scan (Go source)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build AppImage
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh

      - name: Checks (vet, race tests, gofmt, rclone contract tests)
        run: ./scripts/check.sh --quiet

      - name: Show result
        run: ls -lh dist/

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdrive-sync-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
